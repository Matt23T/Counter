<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Contatori</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #f5f5f7;
    --blue: #007aff;
    --red: #ff3b30;
    --text: #111;
    --secondary: #86868b;
    --separator: rgba(60,60,67,.16);
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
    -webkit-font-smoothing: antialiased;
}

button,
input {
    font-family: inherit;
}

.app {
    max-width: 760px;
    min-height: 100vh;
    margin: 0 auto;
    padding-bottom: 50px;
}

header {
    padding: 62px 22px 22px;
}

header h1 {
    margin: 0;
    font-size: 38px;
    line-height: 1;
    font-weight: 750;
    letter-spacing: -1.5px;
}

header p {
    margin: 9px 0 0;
    color: var(--secondary);
    font-size: 16px;
}

/* =========================
   NUOVA ATTIVITÀ
========================= */

.add-button {
    width: calc(100% - 32px);
    height: 52px;
    margin: 0 16px 28px;

    border: 1.5px solid rgba(0,122,255,.75);
    border-radius: 16px;

    background: rgba(255,255,255,.7);
    color: var(--blue);

    font-size: 17px;
    font-weight: 650;

    cursor: pointer;

    transition:
        transform .1s ease,
        background .1s ease;
}

.add-button:active {
    transform: scale(.96);
    background: rgba(0,122,255,.12);
}

/* =========================
   LISTA
========================= */

.section {
    margin: 0 16px;
}

.section-title {
    margin: 0 0 9px 18px;
    color: var(--secondary);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .3px;
}

.activity-list {
    overflow: hidden;
    border-radius: 20px;
    background: rgba(255,255,255,.8);
    box-shadow:
        0 1px 3px rgba(0,0,0,.05),
        0 8px 25px rgba(0,0,0,.035);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

/* Contenitore di ogni attività */
.activity-wrapper {
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--separator);
}

.activity-wrapper:last-child {
    border-bottom: none;
}

/* Pulsante rosso che appare con lo swipe */
.delete-reveal {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;

    width: 88px;

    border: none;
    background: var(--red);
    color: white;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
}

/* Riga che può essere trascinata */
.activity-row {
    position: relative;
    z-index: 2;

    display: flex;
    align-items: center;
    gap: 9px;

    min-height: 76px;
    padding: 11px 12px 11px 14px;

    background: rgba(255,255,255,.86);

    transition: transform .22s ease;
    touch-action: pan-y;
}

.activity-name-button {
    flex: 1;
    min-width: 0;

    height: 47px;
    padding: 0 12px;

    border: 1.5px solid rgba(0,122,255,.75);
    border-radius: 14px;

    background: rgba(255,255,255,.6);
    color: var(--blue);

    font-size: 15px;
    font-weight: 600;

    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    cursor: pointer;

    transition:
        transform .1s ease,
        background .1s ease,
        box-shadow .1s ease;
}

.activity-name-button.small {
    font-size: 13px;
}

.activity-name-button.tiny {
    font-size: 11px;
}

.activity-name-button:active {
    transform: scale(.95);
    background: rgba(0,122,255,.12);
    box-shadow: inset 0 2px 5px rgba(0,0,0,.08);
}

.counter {
    flex: 0 0 auto;
    min-width: 83px;

    font-size: 15px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;

    text-align: right;
    white-space: nowrap;
    letter-spacing: -.2px;
}

.counter.expired {
    color: var(--red);
}

/* =========================
   MODALE
========================= */

.modal-background {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;

    background: rgba(0,0,0,.3);

    align-items: flex-end;
    justify-content: center;

    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}

.modal-background.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 760px;

    padding: 20px 17px 34px;

    background: rgba(247,247,249,.96);
    border-radius: 28px 28px 0 0;

    box-shadow: 0 -10px 40px rgba(0,0,0,.15);

    animation: modalUp .23s ease;
}

@keyframes modalUp {
    from {
        transform: translateY(100%);
    }
    to {
        transform: translateY(0);
    }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
}

.modal-header h2 {
    margin: 0;
    font-size: 23px;
    font-weight: 700;
}

.close-button {
    width: 34px;
    height: 34px;

    border: none;
    border-radius: 50%;

    background: #e4e4e9;
    color: #555;

    font-size: 21px;

    cursor: pointer;
}

.close-button:active {
    transform: scale(.88);
}

.input-label {
    display: block;
    margin: 0 0 7px 4px;

    color: var(--secondary);
    font-size: 13px;
}

.text-input,
.date-input {
    width: 100%;
    height: 52px;

    margin-bottom: 17px;
    padding: 0 15px;

    border: 1px solid rgba(60,60,67,.12);
    border-radius: 15px;

    outline: none;

    background: white;
    color: #000;

    font-size: 17px;
}

.text-input:focus,
.date-input:focus {
    border-color: rgba(0,122,255,.55);
}

.mode-container {
    display: flex;
    gap: 3px;

    padding: 3px;
    margin-bottom: 18px;

    border-radius: 14px;
    background: #e1e1e6;
}

.mode-button {
    flex: 1;
    height: 44px;

    border: none;
    border-radius: 11px;

    background: transparent;
    color: #333;

    font-size: 15px;

    cursor: pointer;
}

.mode-button.active {
    background: white;
    color: #000;
    font-weight: 650;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
}

.countdown-fields {
    display: none;
}

.countdown-fields.show {
    display: block;
}

.save-button {
    width: 100%;
    height: 52px;

    border: none;
    border-radius: 16px;

    background: var(--blue);
    color: white;

    font-size: 17px;
    font-weight: 650;

    cursor: pointer;

    transition:
        transform .1s ease,
        opacity .1s ease;
}

.save-button:active {
    transform: scale(.97);
    opacity: .75;
}

/* =========================
   DETTAGLIO
========================= */

.detail-background {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;

    overflow-y: auto;
    background: var(--bg);
}

.detail-background.show {
    display: block;
}

.detail {
    max-width: 760px;
    min-height: 100vh;
    margin: 0 auto;

    padding: 58px 18px 45px;
}

.detail-top {
    display: flex;
    align-items: center;
    gap: 10px;

    margin-bottom: 35px;
}

.back-button {
    flex: 0 0 auto;

    height: 42px;
    padding: 0 14px;

    border: 1px solid rgba(60,60,67,.12);
    border-radius: 14px;

    background: rgba(255,255,255,.8);
    color: var(--blue);

    font-size: 16px;

    cursor: pointer;
}

.detail-title {
    flex: 1;
    min-width: 0;

    margin: 0;

    font-size: 23px;
    font-weight: 700;

    text-align: center;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.detail-spacer {
    width: 75px;
    flex-shrink: 0;
}

.detail-date {
    margin-bottom: 25px;
    color: var(--secondary);
    font-size: 15px;
    text-align: center;
}

.detail-counter {
    margin-bottom: 18px;
    padding: 36px 15px 31px;

    border-radius: 25px;

    background: rgba(255,255,255,.82);

    box-shadow:
        0 1px 3px rgba(0,0,0,.05),
        0 12px 30px rgba(0,0,0,.035);

    text-align: center;
}

.detail-main-number {
    font-size: 76px;
    line-height: .95;
    font-weight: 750;
    letter-spacing: -4px;
    font-variant-numeric: tabular-nums;
}

.detail-main-label {
    margin-top: 9px;
    color: var(--secondary);
    font-size: 17px;
}

.detail-precise {
    margin-top: 25px;
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

.detail-buttons {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.detail-action {
    width: 100%;
    height: 52px;

    border-radius: 16px;

    background: rgba(255,255,255,.82);

    font-size: 17px;
    font-weight: 600;

    cursor: pointer;

    transition:
        transform .1s ease,
        background .1s ease;
}

.detail-action:active {
    transform: scale(.97);
}

.detail-action.reset {
    border: 1.5px solid rgba(0,122,255,.7);
    color: var(--blue);
}

.detail-action.edit {
    border: 1.5px solid rgba(60,60,67,.28);
    color: #333;
}

.detail-action.delete {
    border: 1.5px solid rgba(255,59,48,.65);
    color: var(--red);
}

/* =========================
   CONFERMA
========================= */

.confirmation-background {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 400;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.32);

    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
}

.confirmation-background.show {
    display: flex;
}

.confirmation {
    width: 100%;
    max-width: 370px;

    overflow: hidden;

    border-radius: 22px;

    background: rgba(250,250,252,.97);

    box-shadow: 0 20px 60px rgba(0,0,0,.2);

    animation: confirmationIn .18s ease;
}

@keyframes confirmationIn {
    from {
        transform: scale(.92);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

.confirmation-content {
    padding: 25px 20px 22px;
    text-align: center;
}

.confirmation h3 {
    margin: 0 0 8px;
    font-size: 20px;
}

.confirmation p {
    margin: 0;
    color: #6d6d72;
    font-size: 15px;
    line-height: 1.4;
}

.confirmation-buttons {
    display: flex;
    border-top: 1px solid var(--separator);
}

.confirmation-buttons button {
    flex: 1;
    height: 52px;

    border: none;
    background: transparent;

    font-size: 16px;

    cursor: pointer;
}

.confirmation-buttons button + button {
    border-left: 1px solid var(--separator);
}

.confirmation-cancel {
    color: var(--blue);
}

.confirmation-confirm {
    color: var(--red);
    font-weight: 650;
}

/* =========================
   EMPTY
========================= */

.empty {
    padding: 45px 20px;
    color: var(--secondary);
    font-size: 16px;
    text-align: center;
    line-height: 1.5;
}

@media (min-width: 700px) {
    .modal-background {
        align-items: center;
    }

    .modal {
        margin: 20px;
        border-radius: 28px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header>
        <h1>Contatori</h1>
        <p>Il tempo delle tue attività</p>
    </header>

    <button
        class="add-button"
        onclick="openAddModal()"
    >
        + Nuova attività
    </button>

    <div class="section">

        <div class="section-title">
            Attività
        </div>

        <div
            class="activity-list"
            id="activityList"
        ></div>

    </div>

</div>


<!-- =========================
     MODALE CREAZIONE / MODIFICA
========================= -->

<div
    class="modal-background"
    id="addModal"
>

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                Nuova attività
            </h2>

            <button
                class="close-button"
                onclick="closeAddModal()"
            >
                ×
            </button>

        </div>


        <label class="input-label">
            Nome attività
        </label>

        <input
            type="text"
            id="activityName"
            class="text-input"
            placeholder="Es. Senza fumare"
            maxlength="50"
        >


        <label class="input-label">
            Tipo
        </label>

        <div class="mode-container">

            <button
                class="mode-button active"
                id="upModeButton"
                onclick="selectMode('up')"
            >
                Conta da quando
            </button>

            <button
                class="mode-button"
                id="downModeButton"
                onclick="selectMode('down')"
            >
                Conta quanto manca
            </button>

        </div>


        <div
            class="countdown-fields"
            id="countdownFields"
        >

            <label class="input-label">
                Data e ora della scadenza
            </label>

            <input
                type="datetime-local"
                id="targetDate"
                class="date-input"
            >

        </div>


        <button
            class="save-button"
            id="saveButton"
            onclick="saveActivity()"
        >
            Crea attività
        </button>

    </div>

</div>


<!-- =========================
     DETTAGLIO
========================= -->

<div
    class="detail-background"
    id="detailBackground"
>

    <div class="detail">

        <div class="detail-top">

            <button
                class="back-button"
                onclick="closeDetail()"
            >
                ‹ Indietro
            </button>

            <h2
                class="detail-title"
                id="detailTitle"
            ></h2>

            <div class="detail-spacer"></div>

        </div>


        <div
            class="detail-date"
            id="detailDate"
        ></div>


        <div class="detail-counter">

            <div
                class="detail-main-number"
                id="detailMainNumber"
            >
                0
            </div>

            <div class="detail-main-label">
                giorni
            </div>

            <div
                class="detail-precise"
                id="detailPrecise"
            >
                0 giorni, 0 ore, 0 minuti, 0 secondi
            </div>

        </div>


        <div class="detail-buttons">

            <button
                class="detail-action reset"
                onclick="requestReset()"
            >
                Ricomincia da oggi
            </button>

            <button
                class="detail-action edit"
                onclick="openEditModal()"
            >
                Modifica attività
            </button>

            <button
                class="detail-action delete"
                onclick="requestDelete()"
            >
                Elimina attività
            </button>

        </div>

    </div>

</div>


<!-- =========================
     CONFERMA
========================= -->

<div
    class="confirmation-background"
    id="confirmationModal"
>

    <div class="confirmation">

        <div class="confirmation-content">

            <h3 id="confirmationTitle">
                Sei sicuro?
            </h3>

            <p id="confirmationText">
                Questa operazione non può essere annullata.
            </p>

        </div>

        <div class="confirmation-buttons">

            <button
                class="confirmation-cancel"
                onclick="closeConfirmation()"
            >
                Annulla
            </button>

            <button
                class="confirmation-confirm"
                id="confirmationButton"
            >
                Conferma
            </button>

        </div>

    </div>

</div>


<script>

const STORAGE_KEY = "contatore_giorni_attivita";

let activities = [];

let selectedMode = "up";

let selectedActivityId = null;

let editingActivityId = null;

let swipeStartX = 0;

let swipeCurrentX = 0;

let swipingRow = null;


/* =========================
   CARICAMENTO
========================= */

function loadActivities() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (saved) {

        try {
            activities = JSON.parse(saved);
        } catch (e) {
            activities = [];
        }

    }

    renderActivities();
}


/* =========================
   SALVATAGGIO
========================= */

function saveActivities() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(activities)
    );

}


/* =========================
   MODALE NUOVA
========================= */

function openAddModal() {

    editingActivityId = null;

    document.getElementById("modalTitle")
        .textContent = "Nuova attività";

    document.getElementById("saveButton")
        .textContent = "Crea attività";

    document.getElementById("activityName")
        .value = "";

    document.getElementById("targetDate")
        .value = "";

    selectMode("up");

    document.getElementById("addModal")
        .classList.add("show");
}


/* =========================
   MODALE MODIFICA
========================= */

function openEditModal() {

    if (!selectedActivityId) return;

    const activity =
        activities.find(
            item => item.id === selectedActivityId
        );

    if (!activity) return;

    editingActivityId =
        activity.id;

    document.getElementById("modalTitle")
        .textContent = "Modifica attività";

    document.getElementById("saveButton")
        .textContent = "Salva modifiche";

    document.getElementById("activityName")
        .value = activity.name;


    if (activity.mode === "up") {

        selectMode("up");

    } else {

        selectMode("down");

        document.getElementById("targetDate")
            .value =
            toDateTimeLocal(
                new Date(activity.targetTimestamp)
            );
    }


    document.getElementById("addModal")
        .classList.add("show");
}


/* =========================
   CHIUSURA MODALE
========================= */

function closeAddModal() {

    document.getElementById("addModal")
        .classList.remove("show");

    editingActivityId = null;
}


/* =========================
   MODALITÀ
========================= */

function selectMode(mode) {

    selectedMode = mode;

    const up =
        document.getElementById("upModeButton");

    const down =
        document.getElementById("downModeButton");

    const fields =
        document.getElementById("countdownFields");


    if (mode === "up") {

        up.classList.add("active");

        down.classList.remove("active");

        fields.classList.remove("show");

    } else {

        down.classList.add("active");

        up.classList.remove("active");

        fields.classList.add("show");

    }
}


/* =========================
   SALVA ATTIVITÀ
========================= */

function saveActivity() {

    const name =
        document.getElementById("activityName")
            .value
            .trim();

    if (!name) {

        alert("Inserisci il nome dell'attività.");

        return;
    }


    /* =====================
       MODIFICA
    ===================== */

    if (editingActivityId) {

        const activity =
            activities.find(
                item =>
                    item.id === editingActivityId
            );

        if (!activity) return;


        const oldMode =
            activity.mode;


        activity.name = name;


        if (selectedMode === "up") {

            activity.mode = "up";

            /*
                Se viene cambiato da countdown
                a contatore crescente,
                parte da questo momento.
            */

            if (oldMode !== "up") {
                activity.startTimestamp = Date.now();
            }

            if (!activity.startTimestamp) {
                activity.startTimestamp = Date.now();
            }

            delete activity.targetTimestamp;

        } else {

            const value =
                document.getElementById("targetDate")
                    .value;

            if (!value) {

                alert(
                    "Inserisci la data e l'ora della scadenza."
                );

                return;
            }

            const timestamp =
                new Date(value).getTime();

            if (isNaN(timestamp)) {

                alert("Data non valida.");

                return;
            }

            activity.mode = "down";

            activity.targetTimestamp =
                timestamp;

            delete activity.startTimestamp;
        }


        saveActivities();

        closeAddModal();

        renderActivities();

        updateDetail();

        return;
    }


    /* =====================
       NUOVA ATTIVITÀ
    ===================== */

    const activity = {

        id: Date.now().toString(),

        name: name,

        mode: selectedMode

    };


    if (selectedMode === "up") {

        activity.startTimestamp =
            Date.now();

    } else {

        const value =
            document.getElementById("targetDate")
                .value;

        if (!value) {

            alert(
                "Inserisci la data e l'ora della scadenza."
            );

            return;
        }

        const timestamp =
            new Date(value).getTime();

        if (isNaN(timestamp)) {

            alert("Data non valida.");

            return;
        }

        activity.targetTimestamp =
            timestamp;
    }


    activities.push(activity);

    saveActivities();

    closeAddModal();

    renderActivities();
}


/* =========================
   TESTO PULSANTE
========================= */

function adaptButtonText(button) {

    button.classList.remove(
        "small",
        "tiny"
    );

    const length =
        button.textContent.trim().length;

    if (length > 27) {

        button.classList.add("tiny");

    } else if (length > 19) {

        button.classList.add("small");

    }
}


/* =========================
   CONTATORE
========================= */

function getCounterMilliseconds(activity) {

    const now = Date.now();

    if (activity.mode === "up") {

        return Math.max(
            0,
            now - activity.startTimestamp
        );
    }

    return Math.max(
        0,
        activity.targetTimestamp - now
    );
}


/* =========================
   FORMATO LISTA
========================= */

function formatListCounter(milliseconds) {

    const totalSeconds =
        Math.floor(milliseconds / 1000);

    const days =
        Math.floor(totalSeconds / 86400);

    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;


    /*
        Secondi visibili soltanto
        prima di arrivare a un'ora.
    */

    if (hours === 0 && days === 0) {

        return `${minutes}m ${seconds}s`;
    }


    /*
        Arrivata almeno un'ora:
        niente secondi.
    */

    if (days === 0) {

        return `${hours}h ${minutes}m`;
    }


    /*
        Arrivato almeno un giorno:
        niente minuti e secondi.
    */

    return `${days}g ${hours}h`;
}


/* =========================
   RENDER LISTA
========================= */

function renderActivities() {

    const list =
        document.getElementById("activityList");


    if (activities.length === 0) {

        list.innerHTML = `
            <div class="empty">
                Nessuna attività.<br>
                Premi "+ Nuova attività" per iniziare.
            </div>
        `;

        return;
    }


    list.innerHTML = "";


    activities.forEach(activity => {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "activity-wrapper";


        /* Pulsante elimina nascosto */

        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete-reveal";

        deleteButton.textContent =
            "Elimina";

        deleteButton.onclick =
            function() {

                requestDeleteActivity(
                    activity.id
                );

            };


        /* Riga */

        const row =
            document.createElement("div");

        row.className =
            "activity-row";

        row.dataset.id =
            activity.id;


        /* Pulsante nome */

        const nameButton =
            document.createElement("button");

        nameButton.className =
            "activity-name-button";

        nameButton.textContent =
            activity.name;

        adaptButtonText(nameButton);


        /*
            UN TOCCO = reset
            ma con conferma.
        */

        nameButton.onclick =
            function() {

                requestResetActivity(
                    activity.id
                );

            };


        /* Contatore */

        const counter =
            document.createElement("div");

        counter.className =
            "counter";

        counter.dataset.id =
            activity.id;


        updateSingleCounter(
            counter,
            activity
        );


        row.appendChild(nameButton);

        row.appendChild(counter);

        wrapper.appendChild(deleteButton);

        wrapper.appendChild(row);

        list.appendChild(wrapper);


        enableSwipe(row);

    });

}


/* =========================
   CONTATORE SINGOLO
========================= */

function updateSingleCounter(
    counter,
    activity
) {

    const milliseconds =
        getCounterMilliseconds(activity);


    if (
        activity.mode === "down" &&
        milliseconds <= 0
    ) {

        counter.textContent =
            "Scaduto";

        counter.classList.add("expired");

        return;
    }


    counter.classList.remove("expired");

    counter.textContent =
        formatListCounter(
            milliseconds
        );
}


/* =========================
   SWIPE IPHONE
========================= */

function enableSwipe(row) {

    row.addEventListener(
        "touchstart",
        function(event) {

            swipeStartX =
                event.touches[0].clientX;

            swipeCurrentX =
                swipeStartX;

            swipingRow =
                row;

        },
        { passive: true }
    );


    row.addEventListener(
        "touchmove",
        function(event) {

            if (swipingRow !== row) {
                return;
            }

            swipeCurrentX =
                event.touches[0].clientX;

            let distance =
                swipeCurrentX -
                swipeStartX;


            /*
                Permettiamo soltanto
                lo swipe verso sinistra.
            */

            if (distance > 0) {
                distance = 0;
            }


            /*
                Limite stile iPhone.
            */

            distance =
                Math.max(
                    -88,
                    distance
                );


            row.style.transition =
                "none";

            row.style.transform =
                `translateX(${distance}px)`;

        },
        { passive: true }
    );


    row.addEventListener(
        "touchend",
        function() {

            if (swipingRow !== row) {
                return;
            }


            const distance =
                swipeCurrentX -
                swipeStartX;


            row.style.transition =
                "transform .22s ease";


            if (distance < -45) {

                row.style.transform =
                    "translateX(-88px)";

            } else {

                row.style.transform =
                    "translateX(0)";

            }


            swipingRow = null;

        }
    );

}


/* =========================
   CHIUDI SWIPE
========================= */

document.addEventListener(
    "touchstart",
    function(event) {

        if (
            !event.target.closest(
                ".activity-row"
            )
        ) {

            document
                .querySelectorAll(
                    ".activity-row"
                )
                .forEach(row => {

                    row.style.transform =
                        "translateX(0)";

                });

        }

    },
    { passive: true }
);


/* =========================
   AGGIORNAMENTO OGNI SECONDO
========================= */

function updateCounters() {

    document
        .querySelectorAll(".counter")
        .forEach(counter => {

            const activity =
                activities.find(
                    item =>
                        item.id ===
                        counter.dataset.id
                );

            if (!activity) return;

            updateSingleCounter(
                counter,
                activity
            );

        });


    updateDetail();
}


/* =========================
   DETTAGLIO
========================= */

function openDetail(id) {

    const activity =
        activities.find(
            item => item.id === id
        );

    if (!activity) return;

    selectedActivityId =
        id;

    document
        .getElementById("detailBackground")
        .classList.add("show");

    document
        .getElementById("detailTitle")
        .textContent =
        activity.name;


    updateDetail();
}


function closeDetail() {

    document
        .getElementById("detailBackground")
        .classList.remove("show");

    selectedActivityId = null;
}


/* =========================
   DETTAGLIO CONTATORE
========================= */

function updateDetail() {

    if (!selectedActivityId) {
        return;
    }


    const activity =
        activities.find(
            item =>
                item.id === selectedActivityId
        );

    if (!activity) {
        return;
    }


    const milliseconds =
        getCounterMilliseconds(activity);


    const totalSeconds =
        Math.floor(
            milliseconds / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );

    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;


    if (
        activity.mode === "up"
    ) {

        document
            .getElementById("detailDate")
            .textContent =
            "Iniziato il " +
            formatExactDate(
                activity.startTimestamp
            );

    } else {

        document
            .getElementById("detailDate")
            .textContent =
            "Scadenza: " +
            formatExactDate(
                activity.targetTimestamp
            );

    }


    if (
        activity.mode === "down" &&
        milliseconds <= 0
    ) {

        document
            .getElementById("detailMainNumber")
            .textContent = "0";

        document
            .getElementById("detailPrecise")
            .textContent = "Scaduto";

        return;
    }


    document
        .getElementById("detailMainNumber")
        .textContent =
        days;


    document
        .getElementById("detailPrecise")
        .textContent =
        `${days} giorni, ${hours} ore, ${minutes} minuti, ${seconds} secondi`;
}


/* =========================
   RESET CON CONFERMA
========================= */

function requestReset() {

    if (!selectedActivityId) {
        return;
    }

    requestResetActivity(
        selectedActivityId
    );
}


function requestResetActivity(id) {

    const activity =
        activities.find(
            item => item.id === id
        );

    if (!activity) return;


    selectedActivityId = id;


    document
        .getElementById("confirmationTitle")
        .textContent =
        "Ricominciare il contatore?";


    document
        .getElementById("confirmationText")
        .textContent =
        "Il contatore verrà azzerato e ripartirà da questo momento.";


    const button =
        document.getElementById(
            "confirmationButton"
        );


    button.textContent =
        "Ricomincia";

    button.style.color =
        "var(--blue)";

    button.onclick =
        confirmReset;


    document
        .getElementById("confirmationModal")
        .classList.add("show");
}


/* =========================
   CONFERMA RESET
========================= */

function confirmReset() {

    const activity =
        activities.find(
            item => item.id === selectedActivityId
        );

    if (!activity) {
        closeConfirmation();
        return;
    }


    if (activity.mode === "up") {

        activity.startTimestamp =
            Date.now();

    } else {

        /*
            Per il countdown chiediamo
            la nuova scadenza.
        */

        closeConfirmation();


        setTimeout(
            function() {

                const value =
                    prompt(
                        "Inserisci la nuova scadenza.\nFormato: AAAA-MM-GG HH:MM"
                    );

                if (!value) {
                    return;
                }


                const timestamp =
                    new Date(
                        value.replace(" ", "T")
                    ).getTime();


                if (isNaN(timestamp)) {

                    alert(
                        "Data non valida."
                    );

                    return;
                }


                activity.targetTimestamp =
                    timestamp;

                saveActivities();

                renderActivities();

                updateDetail();

            },
            100
        );

        return;
    }


    saveActivities();

    closeConfirmation();

    renderActivities();

    updateDetail();
}


/* =========================
   ELIMINAZIONE
========================= */

function requestDelete() {

    if (!selectedActivityId) {
        return;
    }

    requestDeleteActivity(
        selectedActivityId
    );
}


function requestDeleteActivity(id) {

    const activity =
        activities.find(
            item => item.id === id
        );

    if (!activity) return;


    selectedActivityId = id;


    document
        .getElementById("confirmationTitle")
        .textContent =
        "Eliminare attività?";


    document
        .getElementById("confirmationText")
        .textContent =
        `"${activity.name}" verrà eliminata definitivamente.`;


    const button =
        document.getElementById(
            "confirmationButton"
        );


    button.textContent =
        "Elimina";

    button.style.color =
        "var(--red)";

    button.onclick =
        confirmDelete;


    document
        .getElementById("confirmationModal")
        .classList.add("show");
}


function confirmDelete() {

    activities =
        activities.filter(
            item =>
                item.id !== selectedActivityId
        );


    saveActivities();

    closeConfirmation();

    closeDetail();

    renderActivities();
}


/* =========================
   CHIUDI CONFERMA
========================= */

function closeConfirmation() {

    document
        .getElementById("confirmationModal")
        .classList.remove("show");

}


/* =========================
   DATA
========================= */

function formatExactDate(timestamp) {

    const date =
        new Date(timestamp);

    const day =
        String(date.getDate())
            .padStart(2, "0");

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const year =
        date.getFullYear();

    const hours =
        String(date.getHours())
            .padStart(2, "0");

    const minutes =
        String(date.getMinutes())
            .padStart(2, "0");

    const seconds =
        String(date.getSeconds())
            .padStart(2, "0");


    return `${day}/${month}/${year} alle ${hours}:${minutes}:${seconds}`;
}


/* =========================
   DATETIME LOCAL
========================= */

function toDateTimeLocal(date) {

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(date.getDate())
            .padStart(2, "0");

    const hours =
        String(date.getHours())
            .padStart(2, "0");

    const minutes =
        String(date.getMinutes())
            .padStart(2, "0");


    return (
        `${year}-${month}-${day}` +
        `T${hours}:${minutes}`
    );
}


/* =========================
   AVVIO
========================= */

loadActivities();

setInterval(
    updateCounters,
    1000
);

</script>
